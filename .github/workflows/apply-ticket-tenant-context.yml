name: Apply Tenant Runtime Updates

on:
  push:
    branches: [agent/saas-foundation]
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: apply-tenant-runtime-updates
  cancel-in-progress: true

jobs:
  apply:
    if: github.repository == 'johazores/ai-support-workflow-platform' && (github.ref == 'refs/heads/agent/saas-foundation' || github.head_ref == 'agent/saas-foundation')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/saas-foundation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply tenant runtime updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          execution_path = Path("features/workflows/services/workflow-execution-service.ts")
          execution = execution_path.read_text()
          start_marker = "  const defaultOrganization = await ensureDefaultOrganization();"
          end_marker = "  const rules = await prisma.workflowRule.findMany({"
          replacement = '''  if (
            context?.organizationId &&
            ticket.organizationId &&
            ticket.organizationId !== context.organizationId
          ) {
            return { executed: false, message: "Ticket not found." };
          }

          const defaultOrganization = await ensureDefaultOrganization();
          const organizationId =
            context?.organizationId || ticket.organizationId || defaultOrganization.id;

          if (!ticket.organizationId) {
            await prisma.ticket.update({
              where: { id: ticket.id },
              data: { organizationId },
            });
          }

'''

          if "ticket.organizationId !== context.organizationId" not in execution:
              start = execution.index(start_marker)
              end = execution.index(end_marker)
              execution = execution[:start] + replacement + execution[end:]

          execution = execution.replace(
              "  await addTagToTicket(ticket.id, action.value);",
              "  await addTagToTicket(ticket.id, action.value, organizationId);",
              1,
          )
          execution_path.write_text(execution)

          schema_path = Path("prisma/schema.prisma")
          schema = schema_path.read_text()

          def update_model(schema_value, model_name, next_model, replacements, unique_line):
              start = schema_value.index(f"model {model_name} {{")
              end = schema_value.index(f"model {next_model} {{", start)
              block = schema_value[start:end]
              for old, new in replacements:
                  block = block.replace(old, new, 1)
              if unique_line not in block:
                  final_brace = block.rfind("}")
                  block = block[:final_brace] + f"  {unique_line}\n" + block[final_brace:]
              return schema_value[:start] + block + schema_value[end:]

          schema = update_model(
              schema,
              "Customer",
              "Ticket",
              [("  email          String   @unique\n", "  email          String\n")],
              "@@unique([organizationId, email])",
          )
          schema = update_model(
              schema,
              "Tag",
              "SavedReply",
              [("  name           String   @unique\n", "  name           String\n")],
              "@@unique([organizationId, name])",
          )
          schema = update_model(
              schema,
              "SlaPolicy",
              "CsatRating",
              [("  priority              String   @unique\n", "  priority              String\n")],
              "@@unique([organizationId, priority])",
          )
          schema = update_model(
              schema,
              "EmailConfig",
              "EmailTemplate",
              [("  fromAddress    String   @unique\n", "  fromAddress    String\n")],
              "@@unique([organizationId, fromAddress])",
          )
          schema_path.write_text(schema)
          PY

      - name: Format updated files
        run: npx prettier --write features/workflows/services/workflow-execution-service.ts prisma/schema.prisma

      - name: Commit tenant runtime updates
        shell: bash
        run: |
          if git diff --quiet features/workflows/services/workflow-execution-service.ts prisma/schema.prisma; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/workflows/services/workflow-execution-service.ts prisma/schema.prisma
          git commit -m "security: complete tenant runtime constraints"
          git push origin HEAD:agent/saas-foundation
