name: Apply Tenant Runtime Guard

on:
  push:
    branches: [agent/saas-foundation]
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: apply-tenant-runtime-guard
  cancel-in-progress: true

jobs:
  apply:
    if: github.repository == 'johazores/ai-support-workflow-platform' && (github.ref == 'refs/heads/agent/saas-foundation' || github.head_ref == 'agent/saas-foundation')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/saas-foundation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject cross-tenant workflow execution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('features/workflows/services/workflow-execution-service.ts')
          value = path.read_text()
          old = '''  const defaultOrganization = await ensureDefaultOrganization();
          const organizationId =
            context?.organizationId || ticket.organizationId || defaultOrganization.id;

          if (ticket.organizationId !== organizationId) {
            await prisma.ticket.update({
              where: { id: ticket.id },
              data: { organizationId },
            });
          }
          '''
          new = '''  if (
            context?.organizationId &&
            ticket.organizationId &&
            ticket.organizationId !== context.organizationId
          ) {
            return { executed: false, message: "Ticket not found." };
          }

          const defaultOrganization = await ensureDefaultOrganization();
          const organizationId =
            context?.organizationId || ticket.organizationId || defaultOrganization.id;

          if (!ticket.organizationId) {
            await prisma.ticket.update({
              where: { id: ticket.id },
              data: { organizationId },
            });
          }
          '''
          if old in value:
              value = value.replace(old, new, 1)
              path.write_text(value)
          elif new not in value:
              raise SystemExit('Expected workflow tenant block was not found')
          PY

      - name: Commit runtime guard
        shell: bash
        run: |
          if git diff --quiet features/workflows/services/workflow-execution-service.ts; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/workflows/services/workflow-execution-service.ts
          git commit -m "security: reject cross-tenant workflow execution"
          git push origin HEAD:agent/saas-foundation
