name: Apply Tenant Runtime Updates

on:
  push:
    branches: [agent/saas-foundation]
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: apply-tenant-runtime-updates
  cancel-in-progress: true

jobs:
  apply:
    if: github.repository == 'johazores/ai-support-workflow-platform' && (github.ref == 'refs/heads/agent/saas-foundation' || github.head_ref == 'agent/saas-foundation')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/saas-foundation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply tenant runtime updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          execution_path = Path('features/workflows/services/workflow-execution-service.ts')
          execution = execution_path.read_text()
          old_block = '''  const defaultOrganization = await ensureDefaultOrganization();
          const organizationId =
            context?.organizationId || ticket.organizationId || defaultOrganization.id;

          if (ticket.organizationId !== organizationId) {
            await prisma.ticket.update({
              where: { id: ticket.id },
              data: { organizationId },
            });
          }
          '''
          new_block = '''  if (
            context?.organizationId &&
            ticket.organizationId &&
            ticket.organizationId !== context.organizationId
          ) {
            return { executed: false, message: "Ticket not found." };
          }

          const defaultOrganization = await ensureDefaultOrganization();
          const organizationId =
            context?.organizationId || ticket.organizationId || defaultOrganization.id;

          if (!ticket.organizationId) {
            await prisma.ticket.update({
              where: { id: ticket.id },
              data: { organizationId },
            });
          }
          '''
          if old_block in execution:
              execution = execution.replace(old_block, new_block, 1)
          elif new_block not in execution:
              raise SystemExit('Expected workflow tenant block was not found')

          execution = execution.replace(
              '  await addTagToTicket(ticket.id, action.value);',
              '  await addTagToTicket(ticket.id, action.value, organizationId);',
              1,
          )
          execution_path.write_text(execution)

          schema_path = Path('prisma/schema.prisma')
          schema = schema_path.read_text()
          schema = schema.replace('  name           String   @unique\n', '  name           String\n', 1)
          schema = schema.replace(
              '  @@index([organizationId])\n}\n\nmodel SavedReply {',
              '  @@unique([organizationId, name])\n  @@index([organizationId])\n}\n\nmodel SavedReply {',
              1,
          )
          schema_path.write_text(schema)
          PY

      - name: Commit tenant runtime updates
        shell: bash
        run: |
          if git diff --quiet features/workflows/services/workflow-execution-service.ts prisma/schema.prisma; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/workflows/services/workflow-execution-service.ts prisma/schema.prisma
          git commit -m "security: complete tenant runtime constraints"
          git push origin HEAD:agent/saas-foundation
