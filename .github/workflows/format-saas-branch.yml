name: Format SaaS Foundation Branch

on:
  push:
    branches: [agent/saas-foundation]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'johazores/ai-support-workflow-platform'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/saas-foundation

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply Prettier
        run: npx prettier --write .

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format SaaS foundation"
          git push origin HEAD:agent/saas-foundation
