name: Rename SaaS Foundation Branch

on:
  push:
    branches: [agent/saas-foundation]

permissions:
  contents: write

jobs:
  rename:
    if: github.repository == 'johazores/ai-support-workflow-platform'
    runs-on: ubuntu-latest

    steps:
      - name: Rename branch and preserve pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --location --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/agent%2Fsaas-foundation/rename" \
            --data '{"new_name":"feat/saas-foundation"}'
