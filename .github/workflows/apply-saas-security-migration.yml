name: Apply SaaS Security Migration

on:
  workflow_dispatch:
  push:
    branches: [feat/saas-foundation]
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: apply-saas-security-migration-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.repository == 'johazores/ai-support-workflow-platform' && github.actor != 'github-actions[bot]' && (github.ref == 'refs/heads/feat/saas-foundation' || github.head_ref == 'feat/saas-foundation')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/saas-foundation
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply and validate migration
        id: migration
        shell: bash
        env:
          DATABASE_URL: mongodb://localhost:27017/ci-placeholder
          SESSION_SECRET: ci-test-secret-do-not-use-in-production
          ROOT_SESSION_SECRET: ci-root-session-secret-do-not-use-in-production
          CONFIG_ENCRYPTION_KEY: Y2ktdGVzdC1rZXktMzItYnl0ZXMtbG9uZyEhISEhISE=
        run: |
          set +e
          exec > >(tee migration-validation.log) 2>&1
          git rev-parse HEAD^{tree} > base-tree-sha.txt

          status=0
          cat .github/patches/saas-security-migration.*.patch > /tmp/saas-security-migration.patch
          git apply --index --whitespace=nowarn /tmp/saas-security-migration.patch || status=$?

          if [ "$status" -eq 0 ]; then npm ci || status=$?; fi
          if [ "$status" -eq 0 ]; then npx prisma generate || status=$?; fi
          if [ "$status" -eq 0 ]; then npx prisma validate || status=$?; fi
          if [ "$status" -eq 0 ]; then npx prettier --write app pages features components lib prisma docs scripts package.json package-lock.json tsconfig.json next.config.ts eslint.config.mjs postcss.config.mjs vitest.config.ts .github/workflows || status=$?; fi
          if [ "$status" -eq 0 ]; then npm run type-check -- --pretty false || status=$?; fi
          if [ "$status" -eq 0 ]; then npx eslint . --max-warnings 0 || status=$?; fi
          if [ "$status" -eq 0 ]; then npx vitest run --reporter=verbose || status=$?; fi
          if [ "$status" -eq 0 ]; then npx next build || status=$?; fi

          if [ "$status" -ne 0 ]; then
            {
              echo "# SaaS Migration Validation Failure"
              echo
              echo "Run: ${GITHUB_RUN_ID}"
              echo
              echo "The one-time migration job failed with exit code ${status}."
              echo
              echo '```text'
              tail -n 400 migration-validation.log
              echo '```'
            } > migration-validation-failure.md
            exit "$status"
          fi

          git diff HEAD --name-only --diff-filter=ACM > validated-files.txt
          git diff HEAD --name-only --diff-filter=D > deleted-files.txt
          tar -czf validated-files.tar.gz -T validated-files.txt
          echo success > migration-status.txt

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-diagnostics-${{ github.event_name }}
          path: |
            migration-validation.log
            migration-validation-failure.md
            base-tree-sha.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload validated migration
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: validated-migration-${{ github.event_name }}
          path: |
            validated-files.tar.gz
            validated-files.txt
            deleted-files.txt
            base-tree-sha.txt
            migration-status.txt
          retention-days: 7

      - name: Publish validated migration
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/MIGRATION_VALIDATION_FAILURE.md migration-validation.log
          git rm -rf .github/patches
          git rm -f .github/workflows/apply-saas-security-migration.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: complete tenant and authentication migration"
          git push origin HEAD:feat/saas-foundation
