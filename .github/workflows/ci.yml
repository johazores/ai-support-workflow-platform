name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma Schema
        run: npx prisma validate
        env:
          DATABASE_URL: "mongodb://localhost:27017/ci-placeholder"

      - name: Type Check
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run type-check -- --pretty false 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload Type Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Lint
        id: lint
        if: always() && steps.typecheck.outcome == 'success'
        shell: bash
        run: |
          set +e
          npx eslint . --max-warnings 0 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Format Check
        id: format
        if: always() && steps.typecheck.outcome == 'success'
        shell: bash
        run: |
          set +e
          npx prettier --write . 2>&1 | tee format.log
          git diff --name-only --diff-filter=ACM > formatted-files.txt
          if [ -s formatted-files.txt ]; then
            tar -czf formatted-files.tar.gz -T formatted-files.txt
          fi
          git diff --exit-code
          status=$?
          exit $status

      - name: Upload Format Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-report
          path: format.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Formatted Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-files
          path: formatted-files.tar.gz
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: npx vitest run --reporter=verbose

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npx next build
        env:
          DATABASE_URL: "mongodb://localhost:27017/ci-placeholder"
          SESSION_SECRET: "ci-test-secret-do-not-use-in-production"
          ROOT_SESSION_SECRET: "ci-root-session-secret-do-not-use-in-production"
          CONFIG_ENCRYPTION_KEY: "Y2ktdGVzdC1rZXktMzItYnl0ZXMtbG9uZyEhISEhISE="
