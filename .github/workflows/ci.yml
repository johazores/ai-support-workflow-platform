name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mongodb://localhost:27017/ci-placeholder
      SESSION_SECRET: ci-test-secret-do-not-use-in-production
      ROOT_SESSION_SECRET: ci-root-session-secret-do-not-use-in-production
      CONFIG_ENCRYPTION_KEY: Y2ktdGVzdC1rZXktMzItYnl0ZXMtbG9uZyEhISEhISE=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma Schema
        run: npm run prisma:validate

      - name: Audit API Security Boundaries
        run: npm run audit:api-boundaries

      - name: Type Check
        run: npm run type-check -- --pretty false

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Format Check
        run: npm run format:check

      - name: Tests
        run: npm test -- --reporter=verbose

      - name: Production Build
        run: npm run build
