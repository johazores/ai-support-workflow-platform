name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma Schema
        run: npx prisma validate
        env:
          DATABASE_URL: "mongodb://localhost:27017/ci-placeholder"

      - name: Type Check
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run type-check -- --pretty false 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload Type Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Format Check
        run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: npx vitest run --reporter=verbose

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npx next build
        env:
          DATABASE_URL: "mongodb://localhost:27017/ci-placeholder"
          SESSION_SECRET: "ci-test-secret-do-not-use-in-production"
          ROOT_SESSION_SECRET: "ci-root-session-secret-do-not-use-in-production"
          CONFIG_ENCRYPTION_KEY: "Y2ktdGVzdC1rZXktMzItYnl0ZXMtbG9uZyEhISEhISE="
