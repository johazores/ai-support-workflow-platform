name: Sync Clerk Lockfile

on:
  push:
    branches: [agent/saas-foundation]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'johazores/ai-support-workflow-platform'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/saas-foundation

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync package lock
        run: npm install --package-lock-only

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet package-lock.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add Clerk dependency lockfile"
          git push origin HEAD:agent/saas-foundation
