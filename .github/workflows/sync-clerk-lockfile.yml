name: Sync Clerk Foundation

on:
  push:
    branches: [agent/saas-foundation]
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: sync-clerk-foundation
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'johazores/ai-support-workflow-platform' && (github.ref == 'refs/heads/agent/saas-foundation' || github.head_ref == 'agent/saas-foundation')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/saas-foundation
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Allow Clerk-only product users
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('prisma/schema.prisma')
          value = path.read_text()
          updated = value.replace(
              '  passwordHash          String\n',
              '  passwordHash          String?\n',
              1,
          )
          if updated == value:
              if '  passwordHash          String?\n' not in value:
                  raise SystemExit('User.passwordHash field was not found')
          else:
              path.write_text(updated)
          PY

      - name: Commit synchronized files
        shell: bash
        run: |
          if git diff --quiet package-lock.json prisma/schema.prisma; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json prisma/schema.prisma
          git commit -m "chore: prepare Clerk product authentication"
          git push origin HEAD:agent/saas-foundation
